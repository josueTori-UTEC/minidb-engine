services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: minidb-backend

    # --reload: el código de ./backend se monta como volumen y uvicorn recarga al guardar.
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app/backend
      - ./data:/app/data

    environment:
      - MINIDB_DATA_DIR=/app/data
      - MINIDB_PAGE_SIZE=4096
      - MINIDB_PLANNER=rules

  frontend:
    # Vite compila el cliente y nginx lo sirve; /api se reenvía al servicio backend.
    build: ./frontend

    container_name: minidb-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend
